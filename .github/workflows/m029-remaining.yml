name: M029 remaining portable evidence
on:
  push:
    branches: [engineering/m029-final-portability]
    paths: ['tools/m029_fits.py', 'tools/m029_forecasts.py', 'tools/m029_fixture_sha256.json', 'tools/m029_remaining.py', 'tests/test_m029_portability.py', '.github/workflows/m029-remaining.yml']
permissions:
  contents: read
jobs:
  evidence:
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: .:src
      VECLIB_MAXIMUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLCONFIGDIR: /tmp/m029-mpl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements-v1.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
          python -m venv .venv-m029-sdk-reader
          .venv-m029-sdk-reader/bin/python -m pip install cl-sdk==1.0.0
          .venv-m029-sdk-reader/bin/python -m pip check
          mkdir -p runs
          git rev-parse HEAD > runs/source.txt
          python -m pip freeze > runs/environment.txt
          .venv-m029-sdk-reader/bin/python -m pip freeze > runs/sdk-reader-environment.txt
      - run: python -m pytest -q tests/test_m029_portability.py --junitxml=runs/portability-tests.xml
      - name: One remaining-stage budget for all saved evidence
        run: python scripts/m014_supervise.py runs/remaining-guard 240 python tools/m029_remaining.py runs/remaining --sdk-python .venv-m029-sdk-reader/bin/python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m029-remaining-${{ matrix.os }}
          path: runs/
