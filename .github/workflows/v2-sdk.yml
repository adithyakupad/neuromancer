name: Recover SDK producer and recording diagnostics
on:
  push:
    branches: [engineering/recover-sdk]
    paths: ['tools/recover_sdk/**', '.github/workflows/v2-sdk.yml']
permissions:
  contents: read
jobs:
  diagnostic:
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv-sdk
      - run: .venv-sdk/bin/python -m pip install cl-sdk==1.0.0
      - run: |
          mkdir -p runs
          .venv-sdk/bin/python -m pip check
          .venv-sdk/bin/python -m pip freeze > runs/sdk-dependencies.txt
          uname -srm > runs/sdk-platform.txt
          .venv-sdk/bin/python tools/recover_sdk/suite.py runs/recover-sdk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recover-sdk-${{ matrix.os }}
          path: |
            runs/sdk-*
            runs/recover-sdk/**
            !runs/recover-sdk/shadow/cl/**
