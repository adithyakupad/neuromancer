[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuromancer"
version = "0.2.0"
description = "Qualified simulation interfaces for neural dynamics research"
requires-python = ">=3.12,<3.13"
dependencies = ["brian2==2.10.1", "numpy==2.5.4"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
diagnostic = ["matplotlib==3.10.8"]

[project.scripts]
neuromancer-diagnostic = "neuromancer.diagnostic:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
