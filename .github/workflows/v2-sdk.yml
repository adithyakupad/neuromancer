name: M019 SDK producer-boundary diagnostic
on:
  push:
    branches: [engineering/m019-producer-boundary]
    paths:
      - scripts/m019_*.py
      - .github/workflows/v2-sdk.yml
permissions:
  contents: read
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv-sdk
      - run: .venv-sdk/bin/python -m pip install cl-sdk==1.0.0
      - run: |
          mkdir -p runs
          .venv-sdk/bin/python -m pip check
          .venv-sdk/bin/python -m pip freeze > runs/m019-dependencies.txt
          uname -srm > runs/m019-platform.txt
      - run: |
          export PYTHONPATH="$PWD/src"
          .venv-sdk/bin/python scripts/m019_suite.py runs/m019
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m019-${{ matrix.os }}
          path: runs/m019*
