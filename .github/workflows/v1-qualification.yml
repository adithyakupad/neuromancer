name: V1 package and regression qualification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VECLIB_MAXIMUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLCONFIGDIR: /tmp/neuromancer-v1-ci-mpl
      NEUROMANCER_TEST_ARTIFACTS: runs/supervisor-artifacts
      M008_WORKER_TRACE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v1.txt
      - run: python -m pip wheel --no-build-isolation --no-deps . --wheel-dir dist
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m pip check
      - run: python -c "import numpy,brian2,scipy,pytest; print(numpy.__version__,brian2.__version__,scipy.__version__,pytest.__version__)"
      - run: mkdir -p runs
      - run: python -m pytest -q --junitxml=runs/v1-ci-tests.xml --basetemp=runs/pytest-tmp
      - run: python tools/m008_traced_repeats.py runs/m008-traced
      - run: python tools/m010_diagnose.py runs/m010-diagnostics
      - run: python tools/m010_verify.py diagnostics runs/m010-diagnostics runs/m010-diagnostics-verification.json --live-groups
      - run: python tools/m010_repeats.py runs/m010-repeats
      - run: python tools/m010_verify.py repeats runs/m010-repeats runs/m010-repeats-verification.json --live-groups
      - run: neuromancer-diagnostic --mode smoke --output runs/v1-ci-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1-qualification-${{ matrix.os }}
          path: |
            runs/v1-ci-tests.xml
            runs/v1-ci-smoke
            dist/*.whl
            runs/supervisor-artifacts
            runs/pytest-tmp
            runs/m008-traced
            runs/m010-diagnostics
            runs/m010-repeats
            runs/m010-*-verification.json
